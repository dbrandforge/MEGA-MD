name: Docker image build smoke

on:
  pull_request:
    paths:
      - 'lib/Dockerfile'
      - 'lib/compile.js'
      - 'lib/*.cpp'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'lib/Dockerfile'
      - 'lib/compile.js'
      - 'lib/*.cpp'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./lib/Dockerfile
          push: false
          tags: forge-guard:ci
