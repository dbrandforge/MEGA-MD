name: Oracle Instance Provisioner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover compatible Ubuntu images and Always Free shapes without creating an instance"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: oracle-instance-provisioner
  cancel-in-progress: false

jobs:
  provision:
    # Read-only manual discovery is allowed while provisioning is disabled.
    # Instance creation always requires OCI_PROVISIONING_ENABLED=true.
    if: vars.OCI_PROVISIONING_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check oci

      - name: Discover candidates and optionally provision
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_PRIVATE_KEY_PASSPHRASE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
          OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          OCI_INSTANCE_NAME: ${{ vars.OCI_INSTANCE_NAME }}
          OCI_ASSIGN_PUBLIC_IP: ${{ vars.OCI_ASSIGN_PUBLIC_IP }}
          OCI_ALLOWED_SHAPES: ${{ vars.OCI_ALLOWED_SHAPES }}
          OCI_A1_OCPUS: ${{ vars.OCI_A1_OCPUS }}
          OCI_A1_MEMORY_GB: ${{ vars.OCI_A1_MEMORY_GB }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          PROVISION_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/oracle/provision_instance.py
