name: Dependency security audit

on:
  push:
    branches:
      - fix/group-lock-forbidden-backoff
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production and complete dependency trees
        shell: bash
        run: |
          npm audit --json > full-audit.json || true
          npm audit --omit=dev --json > production-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['FULL TREE', 'full-audit.json'], ['PRODUCTION ONLY', 'production-audit.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const meta = report.metadata?.vulnerabilities || {};
            console.log('\\n=== ' + label + ' ===');
            console.log(JSON.stringify(meta));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                installedRange: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(v => typeof v === 'string' ? v : {
                  title: v.title, url: v.url, range: v.range, cwe: v.cwe, cvss: v.cvss?.score
                })
              }));
            }
          }
          NODE
      - name: Preserve machine-readable audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            full-audit.json
            production-audit.json
          retention-days: 7
