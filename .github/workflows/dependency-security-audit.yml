name: Temporary complete dependency audit

on:
  push:
    branches:
      - fix/complete-dependency-audit

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile with Node 24 npm
        run: |
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update lockfile for patched Vitest"
          git push
      - name: Report full and production audit
        shell: bash
        run: |
          npm audit --json > full-audit.json || true
          npm audit --omit=dev --json > production-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['FULL TREE', 'full-audit.json'], ['PRODUCTION ONLY', 'production-audit.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log('=== ' + label + ' ===');
            console.log(JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable}));
            }
          }
          NODE
