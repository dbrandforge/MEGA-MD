name: Import ChatDual content modules

on:
  push:
    branches:
      - feat/forge-guard-chatdual-integration
    paths:
      - chatDual_22_content_modules_5183.zip
      - chatDual_22_content_modules_SHA256.txt

permissions:
  contents: write

jobs:
  import-bank:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/forge-guard-chatdual-integration
          fetch-depth: 0

      - name: Verify archive, SHA-256, sizes and pair counts
        shell: bash
        run: |
          set -euo pipefail
          test -f chatDual_22_content_modules_5183.zip
          test -f chatDual_22_content_modules_SHA256.txt
          mkdir -p "$RUNNER_TEMP/chatdual-import"
          unzip -q chatDual_22_content_modules_5183.zip -d "$RUNNER_TEMP/chatdual-import"
          CHATDUAL_IMPORT_DIR="$RUNNER_TEMP/chatdual-import" python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ["CHATDUAL_IMPORT_DIR"])
          manifest = pathlib.Path("chatDual_22_content_modules_SHA256.txt").read_text(encoding="utf-8")
          rows = []
          for line in manifest.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              parts = line.split(None, 3)
              if len(parts) != 4:
                  raise SystemExit(f"Invalid manifest row: {line}")
              digest, byte_count, pair_count, relpath = parts
              rows.append((digest, int(byte_count), int(pair_count), relpath))
          if len(rows) != 22:
              raise SystemExit(f"Expected 22 manifest rows, got {len(rows)}")
          total = 0
          seen = set()
          for digest, byte_count, pair_count, relpath in rows:
              if not relpath.startswith("data/chatDual/") or not relpath.endswith(".js"):
                  raise SystemExit(f"Unexpected module path: {relpath}")
              path = root / relpath
              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() != digest:
                  raise SystemExit(f"SHA-256 mismatch: {relpath}")
              if len(raw) != byte_count:
                  raise SystemExit(f"Byte-size mismatch: {relpath}")
              source = raw.decode("utf-8")
              if "export default " not in source:
                  raise SystemExit(f"Missing default export: {relpath}")
              payload = source.split("export default ", 1)[1]
              payload = re.split(r";\s*(?:export const|$)", payload, maxsplit=1)[0].strip()
              data = json.loads(payload)
              count = sum(len(value) for value in data.values() if isinstance(value, list)) if isinstance(data, dict) else len(data)
              if count != pair_count:
                  raise SystemExit(f"Pair-count mismatch: {relpath}: {count} != {pair_count}")
              total += count
              seen.add(relpath)
          actual = {p.relative_to(root).as_posix() for p in (root / "data/chatDual").glob("*.js")}
          if actual != seen:
              raise SystemExit(f"Archive/manifest file set mismatch: archive={len(actual)}, manifest={len(seen)}")
          if total != 5183:
              raise SystemExit(f"Expected 5183 pairs, got {total}")
          print(f"Verified {len(rows)} modules and {total} pairs: SHA-256, byte sizes and pair counts all match.")
          PY
          cp "$RUNNER_TEMP"/chatdual-import/data/chatDual/*.js data/chatDual/
          actual="$(find data/chatDual -maxdepth 1 -type f \( -name 'chatDual_*_data.js' -o -name 'ev_*.js' \) | wc -l)"
          test "$actual" -eq 22

      - name: Verify exported bank count
        run: |
          node --input-type=module -e "import { dualExpansionStats, dualBankExpansionComplete } from './data/chatDual/chatDual_expansion_index.js'; const s = dualExpansionStats(); console.log(s); if (!dualBankExpansionComplete || s.total !== 5183) process.exit(1);"

      - name: Commit extracted modules to feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f chatDual_22_content_modules_5183.zip chatDual_22_content_modules_SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chatDual/*.js
          git add -u chatDual_22_content_modules_5183.zip chatDual_22_content_modules_SHA256.txt
          if git diff --cached --quiet; then
            echo "No module changes to commit."
            exit 0
          fi
          git commit -m "Add verified 5,183-pair ChatDual content modules"
          git push origin HEAD:feat/forge-guard-chatdual-integration
