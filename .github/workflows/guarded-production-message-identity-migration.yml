name: Guarded production message identity migration

on:
  push:
    branches:
      - fix/production-message-identity-gemini-diagnostics
    paths:
      - .github/workflows/guarded-production-message-identity-migration.yml

permissions:
  contents: read

concurrency:
  group: production-message-identity-migration
  cancel-in-progress: false

jobs:
  missing-production-secret:
    if: ${{ secrets.MONGO_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop safely when production secret is unavailable
        run: |
          echo "::error::Repository secret MONGO_URL is not configured. No database operation was attempted."
          exit 1

  migrate:
    if: ${{ secrets.MONGO_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run guarded production migration
        run: npm run migrate:message-identity
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
