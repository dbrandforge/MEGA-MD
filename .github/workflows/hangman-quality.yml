name: Hangman quality quarantine

on:
  pull_request:
    paths:
      - 'plugins/hangman.js'
      - 'test/unit/hangman-quality.test.js'
      - 'test/unit/game-quality.test.js'
      - '.github/workflows/hangman-quality.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/hangman.js'
      - 'test/unit/hangman-quality.test.js'
      - 'test/unit/game-quality.test.js'
      - '.github/workflows/hangman-quality.yml'

permissions:
  contents: read

jobs:
  hangman-quality:
    name: Hangman bank quality (quarantined)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run isolated Hangman quality gate
        run: npm run test:hangman-quality
