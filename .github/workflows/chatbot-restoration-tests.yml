name: Chatbot restoration tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/aiService.js'
      - 'plugins/chatbot.js'
      - 'test/unit/aiService.test.js'
      - '.github/workflows/chatbot-restoration-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
