name: Forge Bot unit tests

permissions:
  contents: write

on:
  pull_request:
    paths:
      - 'data/chatbotResponseLibrary.js'
      - 'data/chatbotResponseExpansion.js'
      - 'plugins/chatbot.js'
      - 'lib/messageHandler.js'
      - 'test/**'
      - '.github/workflows/forgebot-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'data/chatbotResponseLibrary.js'
      - 'data/chatbotResponseExpansion.js'
      - 'plugins/chatbot.js'
      - 'test/**'
      - '.github/workflows/forgebot-tests.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit synchronized npm lockfile
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync lockfile for Baileys 7'
            git push origin HEAD:${GITHUB_HEAD_REF}
          else
            echo 'package-lock.json is already synchronized'
          fi
      - name: Verify Baileys v7 runtime exports
        run: >-
          node --input-type=module -e "import makeWASocket, { useMultiFileAuthState, DisconnectReason, fetchLatestBaileysVersion, Browsers, jidDecode, jidNormalizedUser, makeCacheableSignalKeyStore, delay } from '@whiskeysockets/baileys';
          if (typeof makeWASocket !== 'function' || typeof useMultiFileAuthState !== 'function' || !DisconnectReason || typeof fetchLatestBaileysVersion !== 'function' || !Browsers || typeof jidDecode !== 'function' || typeof jidNormalizedUser !== 'function' || typeof makeCacheableSignalKeyStore !== 'function' || typeof delay !== 'function') process.exit(1);
          console.log('Baileys v7 runtime imports verified');"
      - name: Run Forge Bot unit tests
        run: npm run test:unit
      - name: Run message-routing integration tests
        run: npx vitest run test/integration/messageHandler.test.js -t "routes personal DM messages"
