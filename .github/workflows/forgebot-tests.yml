name: Forge Bot unit tests

on:
  pull_request:
    paths:
      - 'data/chatbotResponseLibrary.js'
      - 'data/chatbotResponseExpansion.js'
      - 'plugins/chatbot.js'
      - 'lib/messageHandler.js'
      - 'test/**'
      - '.github/workflows/forgebot-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'data/chatbotResponseLibrary.js'
      - 'data/chatbotResponseExpansion.js'
      - 'plugins/chatbot.js'
      - 'test/**'
      - '.github/workflows/forgebot-tests.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Forge Bot unit tests
        run: npm run test:unit
      - name: Run message-routing integration tests
        run: npm run test:integration
