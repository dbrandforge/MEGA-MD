name: Board games regression tests

on:
  push:
    branches:
      - forge/add-chess-checkers-and-interactive-sudoku
    paths:
      - 'lib/miniSudoku.js'
      - 'lib/chessEngine.js'
      - 'lib/checkersEngine.js'
      - 'lib/duelGamePlugin.js'
      - 'lib/gameSessionRuntime.js'
      - 'lib/gameplayGuard.js'
      - 'plugins/daylock.js'
      - 'plugins/games.js'
      - 'plugins/sudoku.js'
      - 'plugins/chess.js'
      - 'plugins/checkers.js'
      - 'test/unit/board-games.test.js'
      - 'test/unit/game-quality.test.js'
      - '.github/workflows/board-games.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'lib/miniSudoku.js'
      - 'lib/chessEngine.js'
      - 'lib/checkersEngine.js'
      - 'lib/duelGamePlugin.js'
      - 'plugins/sudoku.js'
      - 'plugins/chess.js'
      - 'plugins/checkers.js'
      - 'test/unit/board-games.test.js'
      - '.github/workflows/board-games.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  board-games:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run board-game engine tests
        run: npm run test:unit
